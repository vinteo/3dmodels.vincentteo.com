name: Deploy Backend to Cloudflare Workers (Disabled)

# Disabled for now - manual trigger only (inactive)
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'packages/backend/**'
  #     - 'config/**'
  #     - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy Worker
    if: false # Disabled for now
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'packages/backend'
          secrets: |
            ONSHAPE_ACCESS_KEY
            ONSHAPE_SECRET_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
          ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
